name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project (keep our code)
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --platforms=android --project-name vdl_app --org com.example .
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml
      - name: Patch manifest (internet, notifications, foreground service)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>'
          sed -i "s#<application#$PERMS\n    <application android:usesCleartextTraffic=\"true\"#" $F
          sed -i 's#</application>#    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" android:foregroundServiceType="dataSync" android:exported="false" />\n    </application>#' $F
          cat $F
      - name: Disable Android lint on release (lint crashes on a plugin)
        run: |
          cat >> android/build.gradle.kts <<'KTS'

          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital") || name.startsWith("lintAnalyze")) {
                      enabled = false
                  }
              }
          }
          KTS
          tail -12 android/build.gradle.kts
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vdl-apk
          path: build/app/outputs/flutter-apk/app-release.apk
